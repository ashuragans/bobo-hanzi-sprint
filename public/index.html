lowly it is done: 他跑得很快. If the verb has an object (游泳, 做飯, 唱歌, 打網球), say the verb twice: 王先生游泳游得很好 — or put the object first: 妳的網球打得很好. Ask: 你游泳游得怎麼樣？ Answer: 很好 · 不錯 · 不太好 · 很慢.","tip":"的 + noun (我的書, 可愛的狗) · Verb + 得 (跑得快, 打得很好)","bonus":false,"later":false,"L":"L6","ex":[[[["王太太","Wáng tàitai"],["做飯","zuòfàn"],["做","zuò"],["得","de"],["很","hěn"],["好","hǎo"],["。",""]],"Mrs. Wang cooks very well."],[[["王先生","Wáng xiānshēng"],["游泳","yóuyǒng"],["游","yóu"],["得","de"],["很","hěn"],["好","hǎo"],["。",""]],"Mr. Wang swims very well."],[[["我","wǒ"],["會","huì"],["游泳","yóuyǒng"],["，",""],["可是","kěshì"],["游","yóu"],["得","de"],["不太好","bú tài hǎo"],["。",""]],"I can swim, but not very well."],[[["我","wǒ"],["跑步","pǎobù"],["跑得","pǎo de"],["很","hěn"],["慢","màn"],["。",""]],"I run very slowly."],[[["中明","Zhōngmíng"],["說","shuō"],["妳","nǐ"],["的","de"],["網球","wǎngqiú"],["打","dǎ"],["得","de"],["很","hěn"],["好","hǎo"],["。",""]],"Zhongming says you play tennis really well."],[[["他","tā"],["說得","shuō de"],["很","hěn"],["快","kuài"],["，",""],["請","qǐng"],["說","shuō"],["慢","màn"],["一點","yì diǎn"],["。",""]],"He speaks fast — please speak a little slower."]],"wr":[["他游泳得很好。","他游泳游得很好。","Say the verb again before 得."],["他說中文得很好。","他中文說得很好。","得 must follow the verb directly."],["他跑的很快。","他跑得很快。","After a verb use 得, not 的."]]},"g_tai_le":{"t":"太…了 — too…!","p":"太 + Adj + 了","x":"太…了 = too much / so…! 太貴了 = too expensive. 不太 + Adj = not very.","tip":"","bonus":false,"later":false,"L":"L4","ex":[[[["這個","zhège"],["太","tài"],["貴","guì"],["了","le"],["！",""]],"This is too expensive!"],[[["太","tài"],["好","hǎo"],["了","le"],["！",""]],"Great!"],[[["今天","jīntiān"],["不太","bú tài"],["熱","rè"],["。",""]],"Today isn't very hot."]],"wr":[]},"g_youdian":{"t":"有(一)點 + adjective vs 一點 + noun — a bit / a little","p":"有(一)點(兒) + Adj/feeling　·　(V +) 一點(兒) + Noun","x":"有一點 / 有點 (兒) before an adjective or a feeling = a bit, usually something you don't like: 我有一點累, 今天有點冷, 這件衣服有點貴. Before a noun, use 一點 = a little (of it): 請給我一點水. In 錢包裡有一點錢 the 有 is just 'there is'. Compare Lesson 4: 喝一點兒飲料.","tip":"a bit + adjective → 有一點 · a little + noun → 一點 · a lot → 很多","bonus":false,"later":false,"L":"L6","ex":[[[["我","wǒ"],["覺得","juéde"],["有一點兒","yǒu yìdiǎnr"],["累","lèi"],["。",""]],"I feel a little tired."],[[["今天","jīntiān"],["有點","yǒudiǎn"],["冷","lěng"],["。",""]],"It's a bit cold today."],[[["這","zhè"],["件","jiàn"],["衣服","yīfu"],["有點","yǒudiǎn"],["貴","guì"],["。",""]],"This piece of clothing is a bit expensive."],[[["這個","zhège"],["蛋糕","dàngāo"],["有點","yǒudiǎn"],["甜","tián"],["。",""]],"This cake is a bit sweet."],[[["請","qǐng"],["給","gěi"],["我","wǒ"],["一點","yì diǎn"],["水","shuǐ"],["。",""]],"Please give me a little water."],[[["錢包","qiánbāo"],["裡","lǐ"],["有一點","yǒu yìdiǎn"],["錢","qián"],["。",""]],"There's a little money in the wallet."]],"wr":[["這個一點貴。","這個有一點貴。","Before an adjective: 有一點."],["請給我有一點水。","請給我一點水。","Before a noun: 一點, no 有."]]},"g_haishi":{"t":"還是 (or, in questions) vs 或是 (or, in statements)","p":"A 還是 B？　·　A 或是 B。","x":"Questions offering a choice use 還是: 你要咖啡還是茶？ Statements use 或是: 我喝咖啡或是茶都可以.","tip":"","bonus":false,"later":false,"L":"L4","ex":[[[["你","nǐ"],["要","yào"],["喝","hē"],["咖啡","kāfēi"],["還是","háishì"],["茶","chá"],["？",""]],"Do you want coffee or tea?"],[[["你","nǐ"],["是","shì"],["學生","xuéshēng"],["還是","háishì"],["老師","lǎoshī"],["？",""]],"Are you a student or a teacher?"],[[["星期六","xīngqíliù"],["或是","huòshì"],["星期天","xīngqítiān"],["都","dōu"],["可以","kěyǐ"],["。",""]],"Saturday or Sunday are both fine."]],"wr":[["你要咖啡還是茶嗎？","你要咖啡還是茶？","No 嗎 with 還是."]]},"g_bi":{"t":"比 — comparisons","p":"A + 比 + B + Adj","x":"A 比 B + adjective = A is more … than B. Don't put 很 before the adjective.","tip":"","bonus":true,"later":true,"L":"B","ex":[[[["哥哥","gēge"],["比","bǐ"],["我","wǒ"],["高","gāo"],["。",""]],"My older brother is taller than me."],[[["台灣","Táiwān"],["比","bǐ"],["日本","Rìběn"],["熱","rè"],["。",""]],"Taiwan is hotter than Japan."],[[["香蕉","xiāngjiāo"],["比","bǐ"],["蘋果","píngguǒ"],["便宜","piányí"],["。",""]],"Bananas are cheaper than apples."]],"wr":[["他比我很高。","他比我高。","No 很 in 比 sentences."]]},"g_yinwei":{"t":"因為…所以… — because…so…","p":"因為 + reason，所以 + result","x":"Chinese often uses both halves together. Reason first, result second.","tip":"","bonus":true,"later":true,"L":"B","ex":[[[["因為","yīnwèi"],["今天","jīntiān"],["下雨","xiàyǔ"],["，",""],["所以","suǒyǐ"],["我","wǒ"],["不去","bú qù"],["。",""]],"Because it's raining today, I'm not going."],[[["因為","yīnwèi"],["我","wǒ"],["很","hěn"],["累","lèi"],["，",""],["所以","suǒyǐ"],["想","xiǎng"],["休息","xiūxí"],["。",""]],"I'm tired, so I want to rest."]],"wr":[]},"g_location":{"t":"N + 在 + place + 上面/下面/裡面… — where something is","p":"Thing + 在 + Place + 上面/下面/裡面/外面/前面/後面/旁邊","x":"To say where something is: thing first, then 在, then the place, then the position word. The position word comes AFTER the place (English puts it before). 裡 can be short: 房間裡. Ask with 在哪裡？","tip":"上面 on · 下面 under · 裡面 in · 外面 outside · 前面 in front · 後面 behind · 旁邊 next to","bonus":false,"later":false,"L":"L5","ex":[[[["我","wǒ"],["的","de"],["錢包","qiánbāo"],["在哪裡","zài nǎlǐ"],["？",""]],"Where is my wallet?"],[[["你","nǐ"],["的","de"],["筆","bǐ"],["在","zài"],["那","nà"],["本","běn"],["書","shū"],["上面","shàngmiàn"],["。",""]],"Your pen is on that book."],[[["錢包","qiánbāo"],["在","zài"],["椅子","yǐzi"],["下面","xiàmiàn"],["。",""]],"The wallet is under the chair."],[[["我","wǒ"],["的","de"],["房間","fángjiān"],["在","zài"],["客廳","kètīng"],["後面","hòumiàn"],["。",""]],"My room is behind the living room."],[[["他","tā"],["在","zài"],["房間","fángjiān"],["外面","wàimiàn"],["。",""]],"He's outside the room."]],"wr":[["錢包在下面椅子。","錢包在椅子下面。","Place first, then the position word."],["在桌子上有書。","桌子上有書。 / 書在桌子上。","Don't start a 有 sentence with 在."]]},"g_hao_very":{"t":"好 + adjective = so / very","p":"好 + Vs　(今天好熱！)","x":"In speech, 好 before an adjective works like 很 but with more feeling: 好熱 = so hot! 好好吃 = so delicious!","tip":"","bonus":false,"later":false,"L":"L4","ex":[[[["今天","jīntiān"],["天氣","tiānqì"],["好","hǎo"],["熱","rè"],["！",""]],"It's so hot today!"],[[["我","wǒ"],["好","hǎo"],["渴","kě"],["。",""]],"I'm really thirsty."],[[["這","zhè"],["家","jiā"],["的","de"],["牛肉麵","niúròu miàn"],["好","hǎo"],["好吃","hǎochī"],["！",""]],"The beef noodles here are so good!"]],"wr":[["今天是好熱。","今天好熱。","No 是 before adjectives."]]},"g_yidianr":{"t":"Verb + 一點兒 + noun — a little (of something)","p":"想/要 + V + 一點兒 + N","x":"一點兒 (or 一點) after a verb means 'a little / some': 喝一點兒水. Don't confuse it with 有一點 + adjective (Lesson 6), which means 'a bit too…'.","tip":"","bonus":false,"later":false,"L":"L4","ex":[[[["我","wǒ"],["想","xiǎng"],["喝","hē"],["一點兒","yìdiǎnr"],["飲料","yǐnliào"],["。",""]],"I'd like to drink something."],[[["我","wǒ"],["只","zhǐ"],["想","xiǎng"],["吃","chī"],["一點兒","yìdiǎnr"],["水果","shuǐguǒ"],["。",""]],"I only want to eat a little fruit."],[[["我","wǒ"],["會","huì"],["說","shuō"],["一點兒","yìdiǎnr"],["中文","Zhōngwén"],["。",""]],"I can speak a little Chinese."]],"wr":[["我想一點兒喝水。","我想喝一點兒水。","一點兒 goes after the verb."]]},"g_zui":{"t":"最 — the most","p":"最 + adjective / 最 + 喜歡/愛","x":"最 goes right before an adjective or a verb like 喜歡/愛: 最好 (best), 最喜歡 (like most).","tip":"","bonus":false,"later":false,"L":"L4","ex":[[[["秋天","qiūtiān"],["的","de"],["天氣","tiānqì"],["最","zuì"],["好","hǎo"],["。",""]],"Autumn has the best weather."],[[["我","wǒ"],["最","zuì"],["喜歡","xǐhuān"],["喝","hē"],["綠茶","lǜchá"],["。",""]],"I like green tea the most."],[[["這","zhè"],["家","jiā"],["餐廳","cāntīng"],["的","de"],["甜點","tiándiǎn"],["最","zuì"],["好吃","hǎochī"],["。",""]],"This restaurant's desserts are the most delicious."]],"wr":[["我喜歡最綠茶。","我最喜歡綠茶。","最 before the verb."]]},"g_order":{"t":"Ordering food — 我要… / 請給我…","p":"我要 / 請給我 + number + MW + food","x":"Order with 我要 (I want) or the politer 請給我 (please give me). Use the right measure word: 一碗 (bowl), 一杯 (cup), 一瓶 (bottle). The waiter asks 幾位？ (how many people — 位 is polite) and 要點什麼？","tip":"給 + person + thing, just like 送.","bonus":fals   const best = a => a.slice().sort((x, y) => score(y) - score(x));
  const early = best(conv.filter(b => ['L1', 'L2', 'L3'].includes(b.L))), late = best(conv.filter(b => ['L4', 'L5', 'L6'].includes(b.L)));

const QDEF = { xp: ['⚡', 'Earn 100 XP', 100], lessons: ['📚', 'Finish 2 lessons', 2], combo: ['🔥', 'Get 8 right in a row', 8], perfect: ['💯', 'Finish a lesson with no mistakes', 1],

const hashStr = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
function questsToday() {
  const t = today();
  if (!S.quests || S.quests.date !== t) {
    const others = ['lessons', 'combo', 'perfect', 'listen', 'write', 'words', 'test'];
    const h = hashStr(t); const a = others[h % others.length]; let b = others[(h >> 4) % others.length]; if (b === a) b = others[(others.indexOf(a) + 3) % others.length];
    S.quests = { date: t, items: ['xp', a, b].map(id => ({ id, n: 0, claimed: false })) };
  }
  return S.quests;
}
function questEvent(id, amt = 1, isMax = false) {
  const Q = questsToday();
  Q.items.forEach(it => {
    if (it.id !== id || it.claimed) return;
    const g = QDEF[id][2], before = it.n;
    it.n = Math.min(g, isMax ? Math.max(it.n, amt) : it.n + amt);
    if (before < g && it.n >= g) setTimeout(() => popup(`<span class="pp-ic">${chestSVG(false, 40)}</span><span><b>Quest complete!</b><br><span class="small">${esc(QDEF[id][1])} — claim your chest</span></span>`), 300);

    const rows = [], usedAns = new Set(), cnt = { mw: 0, it: 0, adj: 0, fw: 0 };
    const visOf = (s, h) => { const at = s.toks.findIndex(x => x[0] === h); return s.toks.filter((x, i) => i !== at).map(x => x[0]).join(''); };

    for (const t of ts) {

      const pk = pref.find(k => (SLOT_IDX[W[k].h] || []).some(x => x[0] === t.id));
      if (pk) { const hit = (SLOT_IDX[W[pk].h] || []).find(x => x[0] === t.id); s = genSent(t.id, hit[1] ? { [hit[1]]: hit[2] } : {}, o); }

      if (!s) continue;
      for (const b of shuffle(t.bk.slice())) {

        if (rows.some(r => r.bi.acc(bi.h)) || rows.some(r => bi.acc(r.bi.h))) continue;

const PUN = /[，。？！、：；「」（）]/;
function tokenizeZh(str) {
  const toks = []; let i = 0;
  while (i < str.length) {
    const c = str[i];
    if (PUN.test(c)) { toks.push([c, '']); i++; continue; }
    if (!HAN.test(c)) { i++; continue; }
    let L = Math.min(6, str.length - i), hit = null;
    for (; L >= 1; L--) { const sub = str.slice(i, i + L); if ([...sub].every(ch => HAN.test(ch)) && (OVR[sub] || H2W[sub] || (L > 1 && /^[零一二兩三四五六七八九十百千萬]+$/.test(sub)))) { hit = sub; break; } }
    if (!hit) { hit = c; L = 1; }
    i += L;
    let py = null;
    if (str[i] === '{') { const j = str.indexOf('}', i); py = str.slice(i + 1, j); i = j + 1; }
    toks.push([hit, py ?? pyOf(hit), py != null]);
    if (py != null) { const alt = WL.find(w => w.h === hit && plainPy(w.p) === plainPy(py)); if (alt) toks[toks.length - 1].push(alt.k); }
  }
  toks.forEach((x, k) => { const nx = toks[k + 1]; if (x[2] || !nx || !nx[1]) return; const nt = nx[0] === '個' ? 4 : firstTone(nx[1]); if (x[0] === '不') x[1] = nt === 4 ? 'bú' : 'bù'; if (x[0] === '一') x[1] = nt === 4 ? 'yí' : 'yì'; });
  tokenizeZh.keys = toks.map(x => x[3] || (H2W[x[0]] && H2W[x[0]].k)).filter(Boolean);
  return toks.map(x => [x[0], x[1]]);
}

  const keys = uniq(tokenizeZh.keys);

  const s = { id: 'ex-' + i, toks, en, L: ls.length ? 'L' + Math.max(...ls) : 'L6', src: 'ex', zh: plainZh(toks), keys };
  SENTS.push(s); keys.forEach(k => (SIDX[k] = SIDX[k] || []).push(s));
});
